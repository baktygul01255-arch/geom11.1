<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>Кеңістіктегі координаталар</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&display=swap">
<style>
/* Layout: school-notebook sheet on graph paper. Sticky header, pill tabs, one card per topic
   (text left, rotatable 3D figure right), reference grid, floating pen toolbar over an ink layer. */
:root{
  --u:1.25; --k:1.15; --ul:1.12;
  --paper:#f6f8fd; --grid:#dde5f4; --surface:#ffffff; --surface-2:#eef3fc;
  --ink:#142040; --ink-2:#4b5979; --rule:#ccd6ea;
  --accent:#2447c5; --accent-ink:#ffffff; --accent-soft:rgba(36,71,197,.12);
  --margin:#d63e4f;
  --plane-a:rgba(36,71,197,.17); --edge-a:#2447c5;
  --plane-b:rgba(214,62,79,.17); --edge-b:#d63e4f;
  --plane-c:rgba(17,122,85,.17); --edge-c:#117a55;
  --good:#117a55; --good-soft:rgba(17,122,85,.12); --bad:#c2303f; --bad-soft:rgba(194,48,63,.11);
  --pen-1:#1b3fd0; --pen-2:#d3263f; --pen-3:#0f8a5f;
  --font-display:'Source Serif 4','Noto Serif',Georgia,serif;
  --font-ui:'IBM Plex Sans','Noto Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e1526; --grid:#1a2742; --surface:#141d33; --surface-2:#1a2542;
    --ink:#e8eefc; --ink-2:#a2b2d4; --rule:#2b3b60;
    --accent:#86a6ff; --accent-ink:#0e1526; --accent-soft:rgba(134,166,255,.17);
    --margin:#ff8591;
    --plane-a:rgba(134,166,255,.20); --edge-a:#86a6ff;
    --plane-b:rgba(255,133,145,.20); --edge-b:#ff8591;
    --plane-c:rgba(95,211,161,.20); --edge-c:#5fd3a1;
    --good:#5fd3a1; --good-soft:rgba(95,211,161,.14); --bad:#ff8591; --bad-soft:rgba(255,133,145,.13);
    --pen-1:#8fb0ff; --pen-2:#ff8a98; --pen-3:#5fd3a1;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1526; --grid:#1a2742; --surface:#141d33; --surface-2:#1a2542;
  --ink:#e8eefc; --ink-2:#a2b2d4; --rule:#2b3b60;
  --accent:#86a6ff; --accent-ink:#0e1526; --accent-soft:rgba(134,166,255,.17);
  --margin:#ff8591;
  --plane-a:rgba(134,166,255,.20); --edge-a:#86a6ff;
  --plane-b:rgba(255,133,145,.20); --edge-b:#ff8591;
  --plane-c:rgba(95,211,161,.20); --edge-c:#5fd3a1;
  --good:#5fd3a1; --good-soft:rgba(95,211,161,.14); --bad:#ff8591; --bad-soft:rgba(255,133,145,.13);
  --pen-1:#8fb0ff; --pen-2:#ff8a98; --pen-3:#5fd3a1;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font:400 calc(16px*var(--u))/1.5 var(--font-ui); -webkit-text-size-adjust:100%;
}
button,input{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{width:100%;max-width:calc(1080px*var(--u));margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{padding-block:0 110px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{flex-wrap:wrap;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand-txt{min-width:0}
.brand-t{font:600 calc(21px*var(--ul))/1.1 var(--font-display);letter-spacing:-.01em;white-space:nowrap}
.brand-s{font-size:calc(12.5px*var(--u));color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrl{flex-wrap:wrap;display:flex;align-items:center;gap:8px;flex:none}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--ink-2);font:600 calc(13px*var(--u)) var(--font-ui);padding:0 11px;min-height:calc(38px*var(--k));cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.icon-btn{width:calc(38px*var(--k));height:calc(38px*var(--k));display:grid;place-items:center;border:1px solid var(--rule);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer}
.icon-btn svg,.tool svg{display:block}

/* tabs */
.tabs{display:flex;gap:8px;padding-block:14px 4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);font:600 calc(15px*var(--u)) var(--font-ui);padding:0 16px;min-height:calc(42px*var(--k));border-radius:999px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* sheet */
.sheet{position:relative}
.stack{display:grid;gap:16px;padding-block:12px 24px}
.intro{margin:6px 0 0;max-width:64ch;color:var(--ink-2);font-size:calc(15.5px*var(--u))}
.src-note{margin:0;font-size:calc(12.5px*var(--u));color:var(--ink-2)}
.legend{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:0 14px}
.legend summary{cursor:pointer;font-weight:600;min-height:calc(46px*var(--k));display:flex;align-items:center}
.legend-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 18px;padding:2px 0 14px;margin:0;list-style:none}
.legend-g li{display:flex;gap:10px;align-items:baseline;min-width:0}
.legend-g b{font:italic 600 calc(17px*var(--u)) var(--font-display);white-space:nowrap;min-width:5.4em}
.legend-g span{font-size:calc(14px*var(--u));color:var(--ink-2)}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:820px){.card{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);padding:24px;gap:30px}}
.c-text{display:flex;flex-direction:column;gap:14px;min-width:0}
.c-head{display:flex;align-items:center;gap:10px}
.tag{flex:none;background:var(--accent);color:var(--accent-ink);font:700 calc(14px*var(--u)) var(--font-ui);letter-spacing:.03em;padding:4px 10px;border-radius:8px;white-space:nowrap}
.c-head h2{margin:0;font:600 calc(22px*var(--u))/1.2 var(--font-display);text-wrap:balance}
.stmt{margin:0;font:400 calc(19px*var(--u))/1.5 var(--font-display);max-width:58ch}
.defs{margin:0;padding-left:1.2em;display:grid;gap:4px;font-size:calc(15px*var(--u));color:var(--ink-2);max-width:60ch}
.sym{margin:0;background:var(--surface-2);border-radius:10px;padding:10px 12px;font:italic 400 calc(17px*var(--u))/1.5 var(--font-display);overflow-wrap:anywhere}
.sym small{display:block;font:600 calc(11px*var(--u)) var(--font-ui);font-style:normal;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin-bottom:2px}
.real{border-top:1px dashed var(--rule);padding-top:12px}
.real small{font:600 calc(11px*var(--u)) var(--font-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--margin)}
.real p{margin:2px 0 0;font-size:calc(15px*var(--u));color:var(--ink-2);max-width:58ch}
.extra{margin:0;border-top:1px dashed var(--rule);padding-top:12px;font-size:calc(15px*var(--u));max-width:60ch}
.extra b{font-weight:600}
.proof{border-top:1px dashed var(--rule);padding-top:4px}
.proof summary{cursor:pointer;font-weight:600;min-height:calc(44px*var(--k));display:flex;align-items:center}
.proof ol{margin:0;padding-left:1.3em;display:grid;gap:8px;font-size:calc(15.5px*var(--u));max-width:60ch}
.proof li::marker{font-weight:600;color:var(--ink-2)}
.ref{display:inline-block;font:700 calc(12px*var(--u)) var(--font-ui);background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:0 6px;margin-left:4px;white-space:nowrap}

/* figure */
.c-fig{min-width:0}
.fig{margin:0;background:var(--surface-2);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.fig svg{display:block;width:100%;height:auto;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.fig svg.grab{cursor:grabbing}
.fig figcaption{padding:10px 14px;border-top:1px solid var(--rule);font-size:calc(14.5px*var(--u));line-height:1.45;color:var(--ink-2);min-height:5.2em}
.counts{display:flex;gap:8px;margin-top:10px}
.count{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--rule);border-radius:10px;padding:6px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.count span{font-size:calc(12.5px*var(--u));color:var(--ink-2);min-width:0;overflow-wrap:anywhere}
.count b{font:600 calc(22px*var(--u)) var(--font-display);font-variant-numeric:tabular-nums}
.modes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mode{border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);font:600 calc(13.5px*var(--u)) var(--font-ui);border-radius:999px;padding:0 14px;min-height:calc(38px*var(--k));cursor:pointer}
.mode[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.slider{display:flex;align-items:center;gap:12px;margin-top:10px;font-weight:600;font-size:calc(14px*var(--u))}
.slider span{white-space:nowrap;min-width:4.2em;font-variant-numeric:tabular-nums}
.slider input{flex:1;min-width:0;accent-color:var(--accent);min-height:calc(30px*var(--k))}
.fig-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;font-size:calc(12.5px*var(--u));color:var(--ink-2)}
.link-btn{border:0;background:transparent;color:var(--accent);font:600 calc(13px*var(--u)) var(--font-ui);cursor:pointer;min-height:calc(36px*var(--k));padding:0 4px}
.pl-a{fill:var(--plane-a);stroke:var(--edge-a);stroke-width:1.5;stroke-linejoin:round}
.pl-b{fill:var(--plane-b);stroke:var(--edge-b);stroke-width:1.5;stroke-linejoin:round}
.pl-c{fill:var(--plane-c);stroke:var(--edge-c);stroke-width:1.5;stroke-linejoin:round}
.pl-f{fill:var(--plane-a);stroke:none}
.ln{fill:none;stroke-linecap:round}
.ln-ink{stroke:var(--ink)} .ln-accent{stroke:var(--accent)} .ln-faint{stroke:var(--ink-2)}
.pt{fill:var(--ink);stroke:var(--surface-2);stroke-width:2}
.lbl{font:italic 600 calc(18px*var(--ul)) var(--font-display);fill:var(--ink);text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:var(--surface-2);stroke-width:3px}
.lbl-h{fill:var(--ink-2)}
.lbl-a{fill:var(--edge-a)} .lbl-b{fill:var(--edge-b)} .lbl-c{fill:var(--edge-c)} .lbl-ln{fill:var(--accent)}
.lbl-pl{font-size:calc(21px*var(--ul))}

/* reference */
.ref-tools{display:grid;gap:10px}
.search{width:100%;min-height:calc(46px*var(--k));border:1px solid var(--rule);border-radius:12px;background:var(--surface);color:var(--ink);font:500 calc(16px*var(--u)) var(--font-ui);padding:0 14px}
.search::placeholder{color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.rgroup{display:grid;gap:10px}
.rgroup h3{margin:6px 0 0;font:600 calc(13px*var(--u)) var(--font-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.rc{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.rc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.symbtn{border:1px solid var(--rule);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:4px 12px;min-height:calc(44px*var(--k));max-width:100%;font:italic 600 calc(24px*var(--u))/1.2 var(--font-display);cursor:pointer;text-align:left;overflow-wrap:anywhere}
.symbtn:hover{border-color:var(--accent)}
.rc-term{font:600 calc(20px*var(--u))/1.25 var(--font-display)}
.rc-src{flex:none;font:700 calc(12px*var(--u)) var(--font-ui);color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:2px 7px;white-space:nowrap}
.rc-txt{margin:0;font-size:calc(15px*var(--u))}
.rc-ex{margin:0;font:italic calc(15.5px*var(--u)) var(--font-display);color:var(--ink-2);overflow-wrap:anywhere}
.rc-alt{margin:0;font-size:calc(13.5px*var(--u));color:var(--ink-2)}
.empty{padding:28px 12px;text-align:center;color:var(--ink-2)}

/* quiz */
.quiz{max-width:720px;grid-template-columns:minmax(0,1fr)!important;gap:16px}
.prog{display:flex;gap:4px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--rule)}
.prog i.on{background:var(--accent)}
.q-n{font-size:calc(13px*var(--u));color:var(--ink-2);font-weight:600}
.q-t{margin:0;font:600 calc(21px*var(--ul))/1.35 var(--font-display);text-wrap:balance}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--rule);border-radius:12px;background:var(--surface);color:var(--ink);font:500 calc(16px*var(--u))/1.4 var(--font-ui);cursor:pointer;min-height:calc(50px*var(--k))}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--rule);display:grid;place-items:center;font-size:calc(12px*var(--u));font-weight:700;color:var(--ink-2)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{margin:0;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:calc(15px*var(--u))}
.fb b.ok{color:var(--good)} .fb b.bad{color:var(--bad)}
.btn{align-self:flex-start;border:0;background:var(--accent);color:var(--accent-ink);font:600 calc(15px*var(--u)) var(--font-ui);padding:0 20px;min-height:calc(46px*var(--k));border-radius:12px;cursor:pointer}
.score{font:600 calc(40px*var(--u))/1 var(--font-display)}

/* pen */
#ink{position:absolute;left:0;top:0;z-index:5;pointer-events:none}
body[data-tool="pen"] #ink,body[data-tool="line"] #ink,body[data-tool="eraser"] #ink{pointer-events:auto;touch-action:none;cursor:crosshair}
body[data-tool="eraser"] #ink{cursor:cell}
.pen{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.pen-bar{pointer-events:auto;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px;padding:6px;background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:0 8px 28px rgba(8,16,40,.22)}
.tool{width:calc(38px*var(--k));height:calc(38px*var(--k));display:grid;place-items:center;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--ink);cursor:pointer;padding:0}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tool.armed{background:var(--bad);color:#fff}
.tool .dot{display:block;border-radius:50%;background:currentColor}
.tool.sw .dot{width:20px;height:20px}
.tool.sw[aria-pressed="true"]{background:transparent;border-color:var(--ink)}
.sep{width:1px;height:24px;background:var(--rule);margin:0 3px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:45;max-width:min(92vw,420px);background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:12px;font-size:calc(14px*var(--u));line-height:1.35;text-align:center;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.ang-f{fill:var(--plane-b);stroke:none}
.ang-s{fill:none;stroke:var(--edge-b);stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round}
.ln-b{stroke:var(--edge-b)} .ln-c{stroke:var(--edge-c)}
.lbl-ang{font-size:calc(17px*var(--ul))}
.brand-t{white-space:normal}
.legend-g{grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr))}
.legend-g b{min-width:0;white-space:normal;flex:none;max-width:45%}
.tab{max-width:calc(100vw - 32px);white-space:normal;line-height:1.25;padding-block:6px}
.brand-t,.brand-s,.c-head h2,.c-text,.stmt,.defs li,.sym{min-width:0;overflow-wrap:break-word;hyphens:auto}

.ln-a{stroke:var(--edge-a)}
.sol-f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.sol-f>label,.sol-o legend{font-weight:700;font-size:calc(calc(14px*var(--u))*var(--u));color:var(--ink-2)}
.sol select,.sol input[type=number]{width:100%;min-width:0;min-height:calc(44px*var(--k));border:1px solid var(--rule);border-radius:12px;background:var(--surface);color:var(--ink);font:500 calc(calc(16px*var(--u))*var(--u)) var(--font-ui);padding:0 12px}
.sol select:focus-visible,.sol input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sol input[aria-invalid="true"]{border-color:var(--edge-b)}
.sol-par{display:flex;flex-wrap:wrap;gap:10px}
.sol-n span{white-space:nowrap}.sol select{font-size:calc(calc(14.5px*var(--u))*var(--u))}
.sol-n{display:flex;align-items:center;gap:8px;flex:1 1 130px;min-width:0;font-weight:700;font-size:calc(calc(15px*var(--u))*var(--u))}
.sol-hint{color:var(--ink-2);font-size:calc(calc(13px*var(--u))*var(--u));overflow-wrap:anywhere}
.sol-objs{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px}
.sol-o{flex:1 1 200px;min-width:0;border:1px solid var(--rule);border-radius:12px;padding:8px 12px 12px;display:flex;flex-direction:column;gap:8px}
.sol-v{display:flex;flex-direction:column;gap:4px;font-size:calc(calc(13px*var(--u))*var(--u));color:var(--ink-2)}
.sol-ans{display:flex;flex-direction:column;gap:8px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:14px;padding:12px 14px;margin:6px 0 12px}
.sol-ans small{font-weight:700;color:var(--accent);font-size:calc(calc(13px*var(--u))*var(--u))}
.sol-res{display:flex;flex-direction:column;gap:2px;min-width:0}
.sol-res .k{color:var(--ink-2);font-size:calc(calc(14px*var(--u))*var(--u))}
.sol-res b{font-size:calc(calc(18px*var(--u))*var(--u));overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.sol-res.main b{font-size:calc(calc(24px*var(--u))*var(--u))}
.sol .proof li{overflow-wrap:anywhere}
.work{margin-top:16px;min-height:calc(220px*var(--k));border:2px dashed var(--rule);border-radius:14px;padding:8px 12px}.work small{color:var(--ink-2);font-weight:600}
.sol-o{flex-direction:row;flex-wrap:wrap}.sol-o legend{flex:none}.sol-v{flex:1 1 90px;min-width:0}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.mt-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.mt-c{position:relative;display:flex;align-items:center;gap:8px;min-width:0;text-align:left;min-height:calc(56px*var(--k));padding:8px 10px;border:1.5px solid var(--rule);border-radius:12px;background:var(--surface);color:var(--ink);font:500 calc(15px*var(--u)) var(--font-ui);cursor:pointer}
.mt-c:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mt-c.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}
.mt-c.got{border-color:var(--accent)}

function coordPlanes(h,lb){
 return [pl([[-h,0,-h],[h,0,-h],[h,0,h],[-h,0,h]],'a',lb?'Oxy':'',2),
         pl([[-h,-h,0],[h,-h,0],[h,h,0],[-h,h,0]],'b',lb?'Oxz':'',3),
         pl([[0,-h,-h],[0,-h,h],[0,h,h],[0,h,-h]],'c',lb?'Oyz':'',1)];
}
function vtxt(a){return '('+a.map(function(x){return fmtN(x,2);}).join('; ')+')';}
function cubeVerts(a){
 return {D:[0,0,0],C:[a,0,0],A:[0,a,0],B:[a,a,0],D1:[0,0,a],C1:[a,0,a],A1:[0,a,a],B1:[a,a,a]};
}
var CUBE_NAMES=['A','B','C','D','A'+SUB,'B'+SUB,'C'+SUB,'D'+SUB],CUBE_KEYS=['A','B','C','D','A1','B1','C1','D1'];
function boxPolyD(p,q,r,s){
 var V=CUBE_KEYS.map(function(k){
  var X={A:[0,q,0],B:[p,q,0],C:[p,0,0],D:[0,0,0],A1:[0,q,r],B1:[p,q,r],C1:[p,0,r],D1:[0,0,r]}[k];
  return A3(X,s);
 });
 return poly(V,[[0,1,2,3],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]],CUBE_NAMES);
}

ITEMS.c2={tag:'§21',
 title:{ru:'Координаты точки в пространстве',kk:'Кеңістіктегі нүктенің координаталары'},
 stmt:{ru:'Через точку A проведём плоскость, перпендикулярную оси Ox; она пересекает ось в точке Ax. Координата точки Ax на оси Ox называется абсциссой точки A. Так же определяются ордината y и аппликата z. Тройка чисел (x; y; z) называется координатами точки A.',
       kk:'A нүктесі арқылы Ox осіне перпендикуляр жазықтық жүргіземіз; ол осьті Ax нүктесінде қияды. Ax нүктесінің Ox осіндегі координатасы A нүктесінің абсциссасы деп аталады. Осыған ұқсас y ординатасы мен z аппликатасы анықталады. (x; y; z) сандарының үштігі A нүктесінің координаталары деп аталады.'},
 defs:{ru:['Ортогональные проекции точки A(x; y; z) на плоскости Oxy, Oxz, Oyz имеют координаты (x; y; 0), (x; 0; z), (0; y; z).','Точка оси Ox имеет координаты (x; 0; 0), точка плоскости Oxy — координаты (x; y; 0).'],
       kk:['A(x; y; z) нүктесінің Oxy, Oxz, Oyz координаталық жазықтықтардағы ортогональ проекцияларының координаталары сәйкесінше (x; y; 0), (x; 0; z), (0; y; z) болады.','Ox осінің нүктесі (x; 0; 0), Oxy жазықтығының нүктесі (x; y; 0) координаталарына ие.']},
 sym:{ru:'A(x; y; z),  Ax(x; 0; 0),  Ay(0; y; 0),  Az(0; 0; z)',kk:'A(x; y; z),  Ax(x; 0; 0),  Ay(0; y; 0),  Az(0; 0; z)'},
 real:{ru:'Положение дрона в комнате задают тремя числами: расстояния вдоль стен и высота над полом.',kk:'Бөлмедегі дронның орнын үш сан береді: қабырғалар бойымен қашықтық және еденнен биіктік.'},
 def:'axes',v0:{yaw:-.35,pitch:.35},
 modes:[{id:'axes',ru:'Проекции на оси',kk:'Остердегі проекциялар',cap:null},
        {id:'planes',ru:'Проекции на плоскости',kk:'Жазықтықтардағы проекциялар',cap:null}],
 slider:{min:-3,max:3,def:2,sym:'z',unit:''},
 dyn:function(v,L){
  var z=v.n,pos=z>0?{ru:'Точка выше плоскости Oxy.',kk:'Нүкте Oxy жазықтығынан жоғары.'}:(z<0?{ru:'Точка ниже плоскости Oxy.',kk:'Нүкте Oxy жазықтығынан төмен.'}:{ru:'Точка лежит в плоскости Oxy.',kk:'Нүкте Oxy жазықтығында жатыр.'});
  var pr=v.mode==='planes'?{ru:' Проекции: (3; 2; 0), (3; 0; '+z+'), (0; 2; '+z+').',kk:' Проекциялар: (3; 2; 0), (3; 0; '+z+'), (0; 2; '+z+').'}:{ru:' Проекции на оси: (3; 0; 0), (0; 2; 0), (0; 0; '+z+').',kk:' Остердегі проекциялар: (3; 0; 0), (0; 2; 0), (0; 0; '+z+').'};
  return L==='ru'?('A(3; 2; '+z+'): абсцисса 3, ордината 2, аппликата '+z+'. '+pos.ru+pr.ru):('A(3; 2; '+z+'): абсциссасы 3, ординатасы 2, аппликатасы '+z+'. '+pos.kk+pr.kk);
 },
 build:function(m,v){
  var s=.3,x=3,y=2,z=v.n,A=[x,y,z],o=[];
  if(m==='planes'){
   o=coordPlanes(1,false).concat(axes3(1.45,.9));
   var xy=[x,y,0],xz=[x,0,z],yz=[0,y,z];
   o.push(dashed(A3(A,s),A3(xy,s),'a'),dashed(A3(A,s),A3(xz,s),'b'),dashed(A3(A,s),A3(yz,s),'c'));
   o.push(Pn(xy,s,'Axy',[0,16]),Pn(xz,s,'Axz',[-16,0]),Pn(yz,s,'Ayz',[-16,-4]),Pn(A,s,'A',[12,-10]));
  }else{
   o=axes3(1.45,.9).concat(dropBox(A,s));
   o.push(Pn([x,0,0],s,'Ax',[0,17]),Pn([0,y,0],s,'Ay',[-15,10]),Pn([0,0,z],s,'Az',[-16,0]),Pn(A,s,'A',[12,-10]));
  }
  return o;
 }};

ITEMS.c3={tag:'§21',

 extra:{ru:'Пример на чертеже: A₁(2; 1; 1), A₂(4; 3; 5), середина C(3; 2; 3). В планиметрии та же формула: ((x₁+x₂)/2; (y₁+y₂)/2).',kk:'Сызбадағы мысал: A₁(2; 1; 1), A₂(4; 3; 5), ортасы C(3; 2; 3). Жазықтықта да формула осындай: ((x₁+x₂)/2; (y₁+y₂)/2).'},

 proof:[
  {ru:'Пусть C(x; y; z) — середина отрезка A₁A₂. Спроектируем отрезок на плоскость Oxy: получим A′₁(x₁; y₁; 0), A′₂(x₂; y₂; 0), C′(x; y; 0).',kk:'C(x; y; z) — A₁A₂ кесіндісінің ортасы болсын. Кесіндіні Oxy жазықтығына проекциялаймыз: A′₁(x₁; y₁; 0), A′₂(x₂; y₂; 0), C′(x; y; 0) нүктелерін аламыз.'},
  {ru:'Ортогональное проектирование сохраняет отношение отрезков, лежащих на одной прямой, значит, C′ — середина A′₁A′₂ и x = (x₁ + x₂)/2, y = (y₁ + y₂)/2.',kk:'Ортогональ проекциялау бір түзудің бойында жатқан кесінділердің қатынасын сақтайды, демек C′ — A′₁A′₂ кесіндісінің ортасы және x = (x₁ + x₂)/2, y = (y₁ + y₂)/2.'},
  {ru:'Проектируя на плоскость Oxz (или Oyz), так же получаем z = (z₁ + z₂)/2.',kk:'Oxz (немесе Oyz) жазықтығына проекциялап, осылайша z = (z₁ + z₂)/2 аламыз.'}],
 def:'seg',v0:{yaw:-.35,pitch:.35},
 modes:[{id:'seg',ru:'Отрезок и середина',kk:'Кесінді және оның ортасы',cap:{ru:'C = ((2+4)/2; (1+3)/2; (1+5)/2) = (3; 2; 3).',kk:'C = ((2+4)/2; (1+3)/2; (1+5)/2) = (3; 2; 3).'}},
        {id:'proj',ru:'Проекция на Oxy',kk:'Oxy-ке проекция',cap:{ru:'Проекция C′(3; 2; 0) — середина проекции A′₁A′₂.',kk:'C′(3; 2; 0) проекциясы — A′₁A′₂ проекциясының ортасы.'}}],
 build:function(m){
  var s=.2,A1=[2,1,1],A2=[4,3,5],C=[3,2,3],o=axes3(1.4,.8);
  if(m==='proj'){
   var B1=[2,1,0],B2=[4,3,0],BC=[3,2,0];
   o=[pl([[-1,0,-1],[1,0,-1],[1,0,1],[-1,0,1]],'a','Oxy',2)].concat(o);
   o.push(dashed(A3(A1,s),A3(B1,s),'faint'),dashed(A3(A2,s),A3(B2,s),'faint'),dashed(A3(C,s),A3(BC,s),'faint'),Sg(B1,B2,s,'c',2.2),Sg(A1,A2,s,'accent',2.6),
    Pn(B1,s,'A′₁',[-16,6]),Pn(B2,s,'A′₂',[14,10]),Pn(BC,s,'C′',[14,8]));

  }
  o.push(Pn(A1,s,'A₁',[-14,-8]),Pn(A2,s,'A₂',[12,-10]),Pn(C,s,'C',[14,-6]));
  return o;
 }};

 title:{ru:'Координаты вектора',kk:'Вектордың координаталары'},
 stmt:{ru:'Отложим вектор от начала координат: его конец A имеет координаты (x; y; z) — это и есть координаты вектора. Векторы i(1; 0; 0), j(0; 1; 0), k(0; 0; 1) называются координатными: их длины равны 1, а направления совпадают с направлениями осей.',
       kk:'Вектордың басы координаталар басымен сәйкес келетіндей салайық. Сонда оның ұшының (x; y; z) координаталары вектордың координаталары деп аталады. i(1; 0; 0), j(0; 1; 0), k(0; 0; 1) векторларын координаталық векторлар деп атаймыз: олардың ұзындықтары 1-ге тең, ал бағыттары координаталар остерінің бағытына дәл келеді.'},
 sym:{ru:'a = x·i + y·j + z·k,  a(x; y; z)',kk:'a = x·i + y·j + z·k,  a(x; y; z)'},
 real:{ru:'Путь дрона: 2 шага вдоль i, 3 вдоль j и 2 вверх вдоль k приводят в точку A.',kk:'Дронның жолы: i бойымен 2 қадам, j бойымен 3 және k бойымен 2 қадам жоғары — A нүктесіне келеді.'},
 proof:[
  {ru:'Отложим вектор a от начала координат, его конец — точка A. Тогда OA = OAx + OAy + OAz.',kk:'a векторын координаталар басынан саламыз, оның ұшы — A нүктесі. Сонда OA = OAx + OAy + OAz теңдігі орындалады.'},
  {ru:'При этом OAx = x·i, OAy = y·j, OAz = z·k.',kk:'Мұнда OAx = x·i, OAy = y·j, OAz = z·k.'},
  {ru:'Значит, a = x·i + y·j + z·k, и такое разложение единственно только для координат (x; y; z) точки A.',kk:'Демек, a = x·i + y·j + z·k және мұндай жіктелу тек A нүктесінің (x; y; z) координаталары үшін ғана орындалады.'}],
 def:'dec',v0:{yaw:-.35,pitch:.35},
 modes:[{id:'ijk',ru:'Координатные векторы',kk:'Координаталық векторлар',cap:{ru:'i(1; 0; 0), j(0; 1; 0), k(0; 0; 1): длины 1, направления осей.',kk:'i(1; 0; 0), j(0; 1; 0), k(0; 0; 1): ұзындықтары 1, остердің бағыттары.'}},
        {id:'dec',ru:'Разложение a = x·i + y·j + z·k',kk:'Жіктеу a = x·i + y·j + z·k',cap:{ru:'a(2; 3; 2) = 2·i + 3·j + 2·k.',kk:'a(2; 3; 2) = 2·i + 3·j + 2·k.'}}],

  if(m==='ijk'){
   var u=.5;
   return axes3(1.45,.7).concat([Ar([0,0,0],[1,0,0],u,'a','i',[0,16]),Ar([0,0,0],[0,1,0],u,'b','j',[-14,6]),Ar([0,0,0],[0,0,1],u,'c','k',[-14,0])]);
  }

   Ar([0,0,0],X,s,'a','2i',[0,16]),Ar(X,XY,s,'b','3j',[16,8]),Ar(XY,a,s,'c','2k',[16,0]),
   Ar([0,0,0],a,s,'accent','a',[-14,-6],3),Pn(a,s,'A',[12,-10])]);
 }};

ITEMS.v2={tag:'§23',

/* ================= solver: coordinates and vectors (§21, §23) ================= */
function T2(ru,kk){return {ru:ru,kk:kk};}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a;}
function exactStr(x2){
 if(!isFinite(x2))return null;
 if(Math.abs(x2)<1e-12)return '0';
 var den,m;
 for(den=1;den<=720;den++){m=x2*den;if(Math.abs(m-Math.round(m))<1e-8*Math.max(1,m)&&Math.round(m)>0)break;}
 if(den>720)return null;
 m=Math.round(m);
 var mn=m*den,k=1,r=mn,d;
 for(d=2;d*d<=r;d++){while(r%(d*d)===0){r/=d*d;k*=d;}}
 var g=gcd(k,den);k/=g;den/=g;
 if(r===1)return den===1?String(k):k+'/'+den;
 var top=(k===1?'':String(k))+'√'+r;
 return den===1?top:top+'/'+den;
}
function sqrtStr(x2,d){var e=exactStr(x2);return e?(/^\d+$/.test(e)?e:e+' ≈ '+fmtN(d,4)):'≈ '+fmtN(d,4);}
function cs(v){return '('+v.map(function(x){return fmtN(x,3);}).join('; ')+')';}
function pn(x){return x<0?'('+fmtN(x,3)+')':fmtN(x,3);}
function decStr(a){
 var nm=['i','j','k'],s='',i,c,ab;
 for(i=0;i<3;i++){c=a[i];if(Math.abs(c)<1e-12)continue;ab=Math.abs(c);
  s+=(s?(c<0?' − ':' + '):(c<0?'−':''))+(Math.abs(ab-1)<1e-12?'':fmtN(ab,3)+'·')+nm[i];}
 return s||'0';
}
function isZ(a){return Math.abs(a[0])<1e-12&&Math.abs(a[1])<1e-12&&Math.abs(a[2])<1e-12;}

/* scene: display coords -> render coords with automatic scale */
function cScene(out){
 var m=1,i;
 out.pts.forEach(function(p){p.forEach(function(c){m=Math.max(m,Math.abs(c));});});
 var s=1.2/(m+.2),Lp=Math.min(1.45,(m+.8)*s),Ln=Math.min(.9,(m*.5+.5)*s);
 var map=function(X){return [X[0]*s,X[2]*s,X[1]*s];};
 if(out.box){
  var b=out.box,mx=Math.max(b.p,b.q,b.r),sb=.8/mx,P=boxPolyD(b.p,b.q,b.r,sb);
  P.ov=axes3((mx+1)*sb*1.1,.5*sb*mx+.3,{noO:1}).concat([ln(map2(b.P,sb),map2(b.Q,sb),{c:'accent',w:3.2,arrow:1})]);
  return [P];
 }
 function map2(X,k){return [X[0]*k,X[2]*k,X[1]*k];}
 var pr=out.prims.map(function(p){
  var q={},k;for(k in p)q[k]=p[k];
  if(p.k==='line'){q.a=map(p.a);q.b=map(p.b);}
  else if(p.k==='plane'){q.pts=p.pts.map(map);}
  else if(p.k==='pt'){q.p=map(p.p);}
  else if(p.k==='ang'){var uu=vunit([p.u[0],p.u[2],p.u[1]]),ww=vunit([p.w[0],p.w[2],p.w[1]]);q.o=map(p.o);q.u=uu;q.w=ww;q.r=Math.min(.3,.35*Math.min(vlen(map(out.pts[0])),vlen(map(out.pts[1])))||.3);}
  return q;
 });
 return axes3(Lp,Ln).concat(pr);
}

var S=108,CX=210,CY=172;

 c=c.map(function(x){return x/R.length;});

  var a=R[f[0]],b=R[f[1]],d=R[f[2]],u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],w=[d[0]-a[0],d[1]-a[1],d[2]-a[2]];
  var n=[u[1]*w[2]-u[2]*w[1],u[2]*w[0]-u[0]*w[2],u[0]*w[1]-u[1]*w[0]],fc=[0,0,0];
  f.forEach(function(k){fc[0]+=R[k][0];fc[1]+=R[k][1];fc[2]+=R[k][2];});
  fc=fc.map(function(x){return x/f.length;});
  if(n[0]*(fc[0]-c[0])+n[1]*(fc[1]-c[1])+n[2]*(fc[2]-c[2])<0)n=[-n[0],-n[1],-n[2]];
  return n[2]>1e-6;
 });
 var sc=R.map(function(r){return {x:CX+r[0]*S,y:CY-r[1]*S};});
 var edges={},vis=R.map(function(){return false;});

   if(!edges[k])edges[k]={a:a,b:b,vis:false};

 });
 var hid='',shown='',fills='',labels='',k,e;
 for(k in edges){
  e=edges[k];
  var seg='<line x1="'+f1(sc[e.a].x)+'" y1="'+f1(sc[e.a].y)+'" x2="'+f1(sc[e.b].x)+'" y2="'+f1(sc[e.b].y)+'"';

   }
   if(p.lab){
    var lt=p.lt||.5,e=p.le==='a'?it.a:(p.le==='m'?{x:it.a.x+(it.b.x-it.a.x)*lt,y:it.a.y+(it.b.y-it.a.y)*lt}:it.b);

   }else if(th>1e-3&&th<Math.PI-1e-3){

function loadStrokes(){var k=penKey();if(!Array.isArray(penStore[k]))penStore[k]=[];strokes=penStore[k];}
function saveInk(){LS.set('coord.ink',penStore);}
function colorOf(c){return getComputedStyle(document.documentElement).getPropertyValue('--pen-'+c.slice(1)).trim()||'#1b3fd0';}
function sizeInk(){
 var v=$('#view'),w=v.clientWidth,h=v.clientHeight;
 if(!w||!h)return;
 dpr=Math.min(window.devicePixelRatio||1,1.5);
 ink.width=Math.round(w*dpr);ink.height=Math.round(h*dpr);
 ink.style.width=w+'px';ink.style.height=h+'px';
 drawAll();
}
function setLine(s){
 var col=colorOf(s.c);
 ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=s.w;ctx.lineCap='round';ctx.lineJoin='round';
}
function drawStroke(s){
 var w=ink.clientWidth,p=s.p.map(function(a){return [a[0]*w,a[1]]});
 setLine(s);
 if(p.length===1){ctx.beginPath();ctx.arc(p[0][0],p[0][1],s.w/2,0,6.2832);ctx.fill();return;}
 ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);
 for(var i=1;i<p.length-1;i++){ctx.quadraticCurveTo(p[i][0],p[i][1],(p[i][0]+p[i+1][0])/2,(p[i][1]+p[i+1][1])/2);}
 var l=p[p.length-1];ctx.lineTo(l[0],l[1]);ctx.stroke();
}
function drawAll(){
 ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.clearRect(0,0,ink.clientWidth,ink.clientHeight);
 strokes.forEach(drawStroke);
}
function pos(e){var r=ink.getBoundingClientRect();return [(e.clientX-r.left)/r.width,e.clientY-r.top];}
function strokeHit(s,x,y,R,w){
 if(s.line){var ax=s.p[0][0]*w,ay=s.p[0][1],bx=s.p[1][0]*w,by=s.p[1][1],vx=bx-ax,vy=by-ay,L2=vx*vx+vy*vy,t=L2?Math.max(0,Math.min(1,((x-ax)*vx+(y-ay)*vy)/L2)):0,px=ax+t*vx-x,py=ay+t*vy-y;return px*px+py*py<R*R;}
 return s.p.some(function(a){var dx=a[0]*w-x,dy=a[1]-y;return dx*dx+dy*dy<R*R;});
}
function eraseAt(e){
 var r=ink.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,R=15,n=strokes.length;
 for(var i=strokes.length-1;i>=0;i--){
  if(strokeHit(strokes[i],x,y,R,r.width))strokes.splice(i,1);
 }
 if(strokes.length!==n)drawAll();
}
ink.addEventListener('pointerdown',function(e){
 if(pen.tool==='off')return;
 e.preventDefault();
 try{ink.setPointerCapture(e.pointerId);}catch(x){}
 if(pen.tool==='line'){cur={c:pen.color,w:SIZES[pen.size],p:[pos(e),pos(e)],line:1};strokes.push(cur);drawAll();return;}
 if(pen.tool==='pen'){
  cur={c:pen.color,w:SIZES[pen.size],p:[pos(e)]};strokes.push(cur);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var q=cur.p[0];setLine(cur);ctx.beginPath();ctx.arc(q[0]*ink.clientWidth,q[1],cur.w/2,0,6.2832);ctx.fill();
 }else{erasing=true;eraseAt(e);}
});
ink.addEventListener('pointermove',function(e){
 if(cur&&cur.line){var p0=pos(e),a0=cur.p[0],w0=ink.clientWidth,ddx=(p0[0]-a0[0])*w0,ddy=p0[1]-a0[1],g0=Math.atan2(Math.abs(ddy),Math.abs(ddx))/D;if(g0<3)p0[1]=a0[1];else if(g0>87)p0[0]=a0[0];cur.p[1]=p0;drawAll();return;}
 if(cur){
  var p=pos(e),l=cur.p[cur.p.length-1],w=ink.clientWidth,dx=(p[0]-l[0])*w,dy=p[1]-l[1];
  if(dx*dx+dy*dy<2.25)return;
  cur.p.push(p);
  ctx.setTransform(dpr,0,0,dpr,0,0);setLine(cur);
  ctx.beginPath();ctx.moveTo(l[0]*w,l[1]);ctx.lineTo(p[0]*w,p[1]);ctx.stroke();
 }else if(erasing){eraseAt(e);}
});
function endInk(){
 if(cur){cur=null;drawAll();saveInk();}
 if(erasing){erasing=false;saveInk();}
}
ink.addEventListener('pointerup',endInk);
ink.addEventListener('pointercancel',endInk);

function toast(msg){
 var el=$('#toast');el.textContent=msg;el.hidden=false;
 clearTimeout(toast.t);toast.t=setTimeout(function(){el.hidden=true;},3200);
}
function renderPen(){
 var t=T[state.lang];
 var colors=['p1','p2','p3'].map(function(c,i){
  return '<button type="button" class="tool sw" data-color="'+c+'" aria-pressed="'+(pen.tool==='pen'&&pen.color===c)+'" aria-label="'+t['c'+(i+1)]+'" title="'+t['c'+(i+1)]+'"><i class="dot" style="background:var(--pen-'+(i+1)+')"></i></button>';
 }).join('');
 var sz=Math.round(SIZES[pen.size]*1.6+4);
 $('#penWrap').innerHTML='<div class="pen-bar" role="toolbar" aria-label="'+t.penGroup+'">'+
  '<button type="button" class="tool" data-tool="pen" aria-pressed="'+(pen.tool==='pen')+'" aria-label="'+t.pen+'" title="'+t.pen+'">'+svgI('pen')+'</button>'+
  '<button type="button" class="tool" data-tool="eraser" aria-pressed="'+(pen.tool==='eraser')+'" aria-label="'+t.eraser+'" title="'+t.eraser+'">'+svgI('eraser')+'</button>'+
  '<button type="button" class="tool" data-tool="line" aria-pressed="'+(pen.tool==='line')+'" aria-label="'+t.lineTool+'" title="'+t.lineTool+'">'+svgI('line')+'</button>'+
  '<span class="sep"></span>'+colors+
  '<button type="button" class="tool" data-act="size" aria-label="'+t.size+'" title="'+t.size+'"><i class="dot" style="width:'+sz+'px;height:'+sz+'px"></i></button>'+
  '<span class="sep"></span>'+
  '<button type="button" class="tool" data-act="undo" aria-label="'+t.undo+'" title="'+t.undo+'">'+svgI('undo')+'</button>'+
  '<button type="button" class="tool'+(pen.armed?' armed':'')+'" data-act="clear" aria-label="'+(pen.armed?t.clearArmed:t.clear)+'" title="'+(pen.armed?t.clearArmed:t.clear)+'">'+svgI('trash')+'</button>'+

/* ---------- events ---------- */
function setTool(name){
 var t=T[state.lang];
 pen.tool=(pen.tool===name)?'off':name;
 renderPen();
 if(pen.tool==='pen')toast(t.penOn);else if(pen.tool==='eraser')toast(t.eraserOn);else if(pen.tool==='line')toast(t.lineOn);
}
function copySym(s){
 var t=T[state.lang];
 function ok(){toast(t.copied+': '+s);}
 function fail(){toast(t.copyFail);}
 try{
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(ok,fail);}else fail();
 }catch(e){fail();}
}
document.addEventListener('click',function(e){
 var el=e.target.closest('button');if(!el)return;
 var t=T[state.lang];
 if(el.dataset.lang){
  state.lang=el.dataset.lang;savePrefs();fullRender();return;
 }
 if(el.dataset.size!==undefined&&el.closest('#sizeSeg')){state.size=+el.dataset.size;savePrefs();applySize();requestAnimationFrame(function(){sizeInk();drawAll();});return;}
 if(el.dataset.tool){setTool(el.dataset.tool);return;}
 if(el.dataset.color){pen.color=el.dataset.color;pen.tool='pen';renderPen();return;}
 var act=el.dataset.act;if(!act)return;
 if(act==='theme'){state.theme=state.theme==='dark'?'light':'dark';savePrefs();renderTheme();requestAnimationFrame(drawAll);}
 else if(act==='tab'){state.tab=el.dataset.tab;savePrefs();fullRender();window.scrollTo(0,0);}
 else if(act==='mode'){
  var v=view(el.dataset.id),nm=el.dataset.mode;
  if(nm==='net'){v.yaw=0;v.pitch=Math.PI/2;}
  else if(v.mode==='net'){v.yaw=-.55;v.pitch=.5;}
  v.mode=nm;
  $$('[data-act="mode"][data-id="'+el.dataset.id+'"]').forEach(function(b){b.setAttribute('aria-pressed',String(b===el));});
  drawFig(el.dataset.id);
 }
 else if(act==='reset'){var v2=view(el.dataset.id);var it0=ITEMS[el.dataset.id];v2.yaw=it0.v0?it0.v0.yaw:-.55;v2.pitch=it0.v0?it0.v0.pitch:.5;drawFig(el.dataset.id);}
 else if(act==='rgroup'){
  state.ref.g=el.dataset.g;
  $$('[data-act="rgroup"]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.g===state.ref.g));});
  $('#refGrid').innerHTML=refGridHTML();requestAnimationFrame(sizeInk);
 }
 else if(act==='copy'){copySym(el.dataset.sym);}
 else if(act==='qpick'){
  var q=state.quiz;if(q.sel!==null)return;
  q.sel=+el.dataset.i;if(q.sel===QUIZ[q.i].a)q.score++;renderView();sizeInk();
 }
 else if(act==='qnext'){
  var qq=state.quiz;
  if(qq.i===QUIZ.length-1)qq.done=true;else{qq.i++;qq.sel=null;}
  renderView();sizeInk();
 }
 else if(act==='qrestart'){state.quiz={i:0,sel:null,score:0,done:false};renderView();sizeInk();}
 else if(act==='size'){pen.size=(pen.size+1)%SIZES.length;renderPen();}
 else if(act==='undo'){strokes.pop();drawAll();saveInk();}
 else if(act==='clear'){
  if(pen.armed){strokes.length=0;drawAll();saveInk();pen.armed=false;clearTimeout(armTimer);renderPen();toast(t.cleared);}
  else{pen.armed=true;renderPen();toast(t.clearArmed);clearTimeout(armTimer);armTimer=setTimeout(function(){pen.armed=false;renderPen();},3000);}
 }
});
document.addEventListener('input',function(e){
 var el=e.target;
 if(el.id==='refq'){state.ref.q=el.value;$('#refGrid').innerHTML=refGridHTML();requestAnimationFrame(sizeInk);}
 else if(el.type==='range'&&el.dataset.id){
  var v=view(el.dataset.id);v.n=+el.value;
  var nv=$('#nv-'+el.dataset.id);if(nv){var sl=ITEMS[el.dataset.id].slider;nv.textContent=sl&&sl.fmt?sl.fmt(v.n):v.n;}
  drawFig(el.dataset.id);
 }
});

/* drag to rotate figures */
var drag=null;
document.addEventListener('pointerdown',function(e){
 var s=e.target.closest&&e.target.closest('svg[data-fig]');if(!s)return;
 drag={id:s.dataset.fig,x:e.clientX,y:e.clientY,pid:e.pointerId,svg:s};
 try{s.setPointerCapture(e.pointerId);}catch(x){}
 s.classList.add('grab');
});
document.addEventListener('pointermove',function(e){
 if(!drag||e.pointerId!==drag.pid)return;
 var v=view(drag.id),dx=e.clientX-drag.x,dy=e.clientY-drag.y;
 drag.x=e.clientX;drag.y=e.clientY;
 v.yaw+=dx*.011;
 if(e.pointerType==='mouse')v.pitch=Math.max(-.25,Math.min(Math.PI/2,v.pitch+dy*.01));
 drawFig(drag.id);
});
function endDrag(e){if(drag&&e.pointerId===drag.pid){drag.svg.classList.remove('grab');drag=null;}}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);
document.addEventListener('keydown',function(e){
 var s=e.target.closest&&e.target.closest('svg[data-fig]');if(!s)return;
 var v=view(s.dataset.fig),k=e.key,h=true;
 if(k==='ArrowLeft')v.yaw-=.12;else if(k==='ArrowRight')v.yaw+=.12;
 else if(k==='ArrowUp')v.pitch=Math.min(Math.PI/2,v.pitch+.08);else if(k==='ArrowDown')v.pitch=Math.max(-.25,v.pitch-.08);
 else h=false;
 if(h){e.preventDefault();drawFig(s.dataset.fig);}
});
